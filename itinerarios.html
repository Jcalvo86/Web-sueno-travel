<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title-tag="itineraries:pageTitle">Itinerarios | Sueño Travel</title>
    <meta name="description" id="meta-description" content="Explora todos nuestros itinerarios y diseña el viaje de tus sueños con la ayuda de nuestros expertos.">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=BJ+Cree&family=Manrope:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind-config.js"></script>
    <!-- CMS Adapters -->
    <script src="controlpanel/adapters/adapter-interface.js"></script>
    <script src="controlpanel/adapters/supabase-adapter.js"></script>
    <script src="controlpanel/adapters/firebase-adapter.js"></script>
    <script src="crm-config.js"></script>
    <script src="controlpanel/data-source-config.js"></script>
    <!-- Dynamic Header Component -->
    <script src="src/js/i18n.js"></script>
    <script src="global-header.js"></script>
</head>
<body class="bg-background text-on-surface font-body-md overflow-x-hidden pt-20" data-page-ns="itineraries">
<div id="global-header"></div>

<!-- Hero Section -->
<header class="relative h-[45vh] w-full flex items-center justify-center overflow-hidden">
    <div class="absolute inset-0 z-0">
        <div class="w-full h-full bg-cover bg-center transition-transform duration-1000 hover:scale-105" style="background-image: url('https://images.unsplash.com/photo-1539650116574-8efeb43e2750?q=80&w=1920')">
        </div>
        <div class="absolute inset-0 bg-gradient-to-b from-primary/30 via-transparent to-primary/60"></div>
    </div>
    <div class="relative z-10 text-center px-margin-mobile max-w-4xl">
        <h1 class="font-display-lg text-4xl md:text-6xl text-white mb-3 font-extrabold tracking-tight" data-i18n="hero.title">Itinerarios Exclusivos</h1>
        <p class="text-white/90 text-body-lg max-w-2xl mx-auto" data-i18n="hero.subtitle">Programas de viaje diseñados al detalle para ofrecerte una inmersión completa y de alto estándar.</p>
    </div>
</header>

<main class="py-16 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto">
    <h2 class="font-display-lg text-3xl md:text-4xl font-bold text-primary text-center mb-4" data-i18n="main.title">Descubre nuestros Programas</h2>
    <p class="text-on-surface-variant text-center max-w-xl mx-auto mb-12" data-i18n="main.subtitle">Desde aventuras por el Nilo hasta el esplendor de Petra. Encuentra el itinerario perfecto para ti.</p>
    
    <div id="itineraries-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Dynamic itinerary cards will go here via JS, or placeholder -->
        <div class="text-center col-span-full py-12">
            <span class="material-symbols-outlined text-4xl text-on-surface-variant/50 mb-2">map</span>
            <p class="text-on-surface-variant text-lg" data-i18n="loading">Cargando itinerarios disponibles...</p>
        </div>
    </div>
</main>

<script>
    // Logic to fetch itineraries from DataSource
    const loadItineraries = async () => {
        try {
            // Wait for DataSource definition
            let checks = 0;
            while (!window.DataSource && checks < 20) {
                await new Promise(r => setTimeout(r, 100));
                checks++;
            }

            if (!window.DataSource) {
                return;
            }

            const travels = await window.DataSource.getItems('travel');
            const products = await window.DataSource.getItems('cms_products');
            const allTrips = [...(travels || []), ...(products || [])];

            const activeTrips = allTrips.filter(t => {
                const isDraft = t.is_published !== undefined ? !t.is_published : (t.isPublished !== undefined ? !t.isPublished : (t.isDraft || false));
                const tripTitle = (t.title || t.name || '').toLowerCase().trim();
                
                // Exclude test trips
                if (tripTitle === 'egipto 1' || tripTitle === 'turquia') {
                    return false;
                }
                
                return !isDraft && t.status !== 'hidden';
            });

            const grid = document.getElementById('itineraries-grid');
            grid.innerHTML = '';
            
            if (activeTrips.length > 0) {
                activeTrips.forEach(trip => {
                    const imgUrl = trip.headerImageUrl || trip.header_image_url || trip.imageUrl || trip.image_url || (trip.itinerary && trip.itinerary[0]?.imageUrl) || 'https://images.unsplash.com/photo-1539650116574-8efeb43e2750?q=80&w=800';
                    const tripTitle = trip.title || trip.name;
                    const duration = trip.durationDays || trip.duration_days || trip.duration || 'Consultar';
                    let sub = trip.destinationsSummary || trip.destinations_summary || trip.subtitle || '';
                    if (Array.isArray(sub)) sub = sub.join(', ');
                    sub = sub.replace(/\s*\([^)]*\)/g, '');

                    const card = document.createElement('a');
                    card.href = `viaje.html?nombre=${window.generateSlug ? window.generateSlug(tripTitle) : encodeURIComponent(tripTitle)}`;
                    card.className = 'bg-surface border border-outline-variant/60 rounded-3xl overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300 group block';
                    
                    card.innerHTML = `
                        <div class="h-56 overflow-hidden relative">
                            <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="${tripTitle}">
                                <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-primary shadow-sm flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[14px]">schedule</span>
                                    ${duration} <span data-i18n="card.days" data-i18n-ns="itineraries">${window.i18n?.t('card.days', 'itineraries') || 'días'}</span>
                                </div>
                            </div>
                            <div class="p-6">
                                <h3 class="font-display-sm text-xl font-bold text-on-surface mb-2">${tripTitle}</h3>
                                <p class="text-on-surface-variant text-sm mb-4 line-clamp-2 h-10 flex items-center">
                                    <span class="material-symbols-outlined text-base mr-1 opacity-70">location_on</span>
                                    ${sub}
                                </p>
                                <div class="pt-4 border-t border-outline-variant/30 flex justify-between items-center">
                                    <span class="text-primary font-semibold flex items-center gap-1 group-hover:gap-2 transition-all">
                                        <span data-i18n="card.viewProgram" data-i18n-ns="itineraries">${window.i18n?.t('card.viewProgram', 'itineraries') || 'Ver Programa'}</span> <span class="material-symbols-outlined text-sm">arrow_forward</span>
                                    </span>
                                </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } else {
                grid.innerHTML = `
                    <div class="text-center col-span-full py-12">
                        <span class="material-symbols-outlined text-4xl text-on-surface-variant/50 mb-2">map</span>
                        <p class="text-on-surface-variant text-lg" data-i18n="empty">Actualmente no hay itinerarios disponibles.</p>
                    </div>
                `;
            }
        } catch (error) {
            console.error('Error loading itineraries:', error);
            const grid = document.getElementById('itineraries-grid');
            if (grid) {
                grid.innerHTML = `
                    <div class="text-center col-span-full py-12">
                        <span class="material-symbols-outlined text-4xl text-on-surface-variant/50 mb-2">error</span>
                        <p class="text-error text-lg" data-i18n="error">Ocurrió un error al cargar los itinerarios.</p>
                    </div>
                `;
            }
        }
    };
    
    // Create a fallback generateSlug function if it doesn't exist
    if (!window.generateSlug) {
        window.generateSlug = (text) => {
            return text.toString().toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^\w\-]+/g, '')
                .replace(/\-\-+/g, '-')
                .replace(/^-+/, '')
                .replace(/-+$/, '');
        };
    }

    window.addEventListener('DOMContentLoaded', loadItineraries);
</script>

<!-- Contact Modal Integration -->
<div id="contact-modal-container"></div>
<script>
    fetch('components/contact-modal.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('contact-modal-container').innerHTML = html;
        });
</script>

<!-- Footer Integration -->
<div id="section-footer"></div>
<script>
    fetch('components/footer.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('section-footer').innerHTML = html;
        });
</script>
</body>
</html>
