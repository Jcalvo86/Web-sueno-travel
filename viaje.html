<!DOCTYPE html>
<html class="scroll-smooth" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cargando itinerario... | Sueño Travel</title>
    <meta name="description" id="meta-description"
        content="Diseñamos experiencias de lujo personalizadas para exploradores cultos. Cargando itinerario..." />
    <link rel="icon" type="image/png" id="dynamic-favicon" href="Imagenes/Favicon.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=BJ+Cree&family=Manrope:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=BJ+Cree&family=Manrope:wght@100..900&amp;family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap"
        rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .ambient-glow {
            box-shadow: 0 20px 40px -15px rgba(9, 21, 36, 0.1);
        }

        .itinerary-line::before {
            content: '';
            position: absolute;
            left: 19px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #C59358 0%, #C59358 80%, transparent 100%);
        }

        @media (max-width: 768px) {
            .itinerary-line::before {
                left: 15px;
            }
        }

        .shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }
    </style>
    <script src="tailwind-config.js"></script>

    <!-- CMS/Data Source Connection Scripts -->
    <script src="controlpanel/adapters/adapter-interface.js"></script>
    <script src="controlpanel/adapters/supabase-adapter.js"></script>
    <script src="controlpanel/adapters/firebase-adapter.js"></script>
    <script src="crm-config.js"></script>
    <script src="controlpanel/data-source-config.js"></script>
    <!-- Dynamic Header Component -->
    <script src="global-header.js"></script>
</head>

<body class="bg-background text-on-surface font-body-md overflow-x-hidden pt-20">
    <div id="global-header"></div>

    <!-- Loader State -->
    <div id="loading-state" class="min-h-[80vh] flex flex-col items-center justify-center gap-4">
        <span class="material-symbols-outlined text-secondary text-5xl animate-spin">progress_activity</span>
        <p class="text-on-surface-variant font-medium text-lg">Cargando itinerario de viaje...</p>
    </div>

    <!-- Main Content (Hidden initially) -->
    <div id="content-state" class="hidden">
        <div id="section-hero"></div>
        
        <section class="py-16 md:py-24 px-margin-mobile md:px-margin-desktop bg-surface relative">
            <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-12 lg:gap-16">
                <!-- Sidebar Navigation -->
                <aside class="hidden lg:block w-1/4 shrink-0">
                    <div class="sticky top-28 space-y-6 bg-surface border border-outline-variant/50 p-6 rounded-3xl shadow-sm">
                        <h4 class="font-display-lg text-sm font-bold text-primary border-b border-outline-variant/60 pb-3 uppercase tracking-wider">Índice del Viaje</h4>
                        <nav id="viaje-index-nav" class="flex flex-col gap-4 text-xs font-semibold">
                            <a href="#section-overview" class="toc-link flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors border-transparent text-primary">
                                <span class="material-symbols-outlined text-base">info</span> Nuestra Ruta
                            </a>
                            <a href="#section-departures" class="toc-link flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors border-transparent text-primary">
                                <span class="material-symbols-outlined text-base">calendar_today</span> Salidas
                            </a>
                            <a href="#section-itinerary" class="toc-link flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors border-transparent text-primary">
                                <span class="material-symbols-outlined text-base">map</span> Itinerario
                            </a>
                            <a href="#section-gallery" class="toc-link flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors border-transparent text-primary">
                                <span class="material-symbols-outlined text-base">photo_library</span> Galería
                            </a>
                            <a href="#section-services" class="toc-link flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors border-transparent text-primary">
                                <span class="material-symbols-outlined text-base">task_alt</span> Servicios
                            </a>
                            <a href="#section-info" class="toc-link flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors border-transparent text-primary">
                                <span class="material-symbols-outlined text-base">summarize</span> Resumen
                            </a>
                        </nav>
                    </div>
                </aside>

                <!-- Right Side: Content Area -->
                <div class="flex-1 min-w-0 space-y-16">
                    <div id="section-overview"></div>
                    <div id="section-departures"></div>
                    <div id="section-itinerary"></div>
                    <div id="section-gallery"></div>
                    <div id="section-services"></div>
                    <div id="section-info"></div>
                </div>
            </div>
        </section>

        <div id="section-cta"></div>
    </div>

    <div id="section-footer"></div>

    <!-- Modal Lightbox for Map -->
    <div id="map-lightbox" class="fixed inset-0 bg-black/90 z-[9999] hidden flex items-center justify-center p-4"
        onclick="if(event.target === this) closeMapLightbox()">
        <div class="relative w-full max-w-[90vh] rounded-2xl overflow-hidden shadow-2xl bg-black aspect-square">
            <div id="lightbox-container" class="w-full h-full relative"></div>
            <button
                class="absolute top-4 right-4 text-white text-4xl font-bold cursor-pointer select-none bg-black/50 hover:bg-black/80 w-12 h-12 flex items-center justify-center rounded-full z-50 transition-colors"
                onclick="closeMapLightbox()">&times;</button>
        </div>
    </div>
    
    <div id="section-reservation-modal"></div>

    <script type="module">
        import { loadTripData } from './src/js/viaje.js';

        // Module Loader: Inyecta los archivos HTML y luego avisa al sistema
        async function loadSection(id, url) {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(id).innerHTML = html;
                    return true;
                }
            } catch (error) {
                console.error('Error loading ' + url, error);
            }
            return false;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Cargamos todas las secciones en paralelo
            await Promise.all([
                loadSection('section-hero', 'components/viaje/viaje-hero.html'),
                loadSection('section-overview', 'components/viaje/viaje-overview.html'),
                loadSection('section-info', 'components/viaje/viaje-info.html'),
                loadSection('section-departures', 'components/viaje/viaje-departures.html'),
                loadSection('section-itinerary', 'components/viaje/viaje-itinerary.html'),
                loadSection('section-services', 'components/viaje/viaje-services.html'),
                loadSection('section-gallery', 'components/viaje/viaje-gallery.html'),
                loadSection('section-cta', 'components/viaje/viaje-cta.html'),
                loadSection('section-footer', 'components/footer.html'),
                loadSection('section-reservation-modal', 'components/viaje/viaje-reservation-modal.html')
            ]);

            // Ejecutamos la lógica de cargar viaje de forma segura una única vez
            loadTripData();
        });
    </script>
</body>

</html>
