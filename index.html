<!DOCTYPE html>
<html class="scroll-smooth" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title data-i18n-title-tag="home:pageTitle">Sueño Travel | Venta de Experiencias de Lujo</title>
    <meta name="description" id="meta-description"
        content="Diseñamos experiencias de lujo personalizadas para exploradores cultos. Viajes a Egipto, Jordania, Grecia y Turquía." />
    <link rel="icon" type="image/png" id="dynamic-favicon" href="Imagenes/Favicon.png">

    <!-- Canonical & Open Graph (Social Cards / WhatsApp / SEO) -->
    <link rel="canonical" href="https://suenotravel.cl/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sueño Travel" />
    <meta property="og:url" content="https://suenotravel.cl/" />
    <meta property="og:title" content="Sueño Travel | Venta de Experiencias de Lujo" />
    <meta property="og:description" content="Diseñamos experiencias de lujo personalizadas para exploradores cultos. Viajes a Egipto, Jordania, Grecia y Turquía." />
    <meta property="og:image" content="https://suenotravel.cl/Imagenes/Sueno-travel-1.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://suenotravel.cl/" />
    <meta name="twitter:title" content="Sueño Travel | Venta de Experiencias de Lujo" />
    <meta name="twitter:description" content="Diseñamos experiencias de lujo personalizadas para exploradores cultos. Viajes a Egipto, Jordania, Grecia y Turquía." />
    <meta name="twitter:image" content="https://suenotravel.cl/Imagenes/Sueno-travel-1.webp" />

    <!-- Fuentes Google Oficiales (Gloock + Manrope + Plus Jakarta Sans + Material Symbols) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Único Compilado y Optimizado de Sueño Travel -->
    <link rel="stylesheet" href="dist/styles.css" />

    <!-- CMS/Data Source Connection Scripts -->
    <script src="controlpanel/adapters/adapter-interface.js"></script>
    <script src="controlpanel/adapters/firebase-adapter.js"></script>
    <script src="crm-config.js"></script>
    <script src="controlpanel/data-source-config.js"></script>
    <!-- i18n Module -->
    <script src="src/js/i18n.js"></script>
    <!-- Dynamic Header Component -->
    <script src="global-header.js"></script>
    <script src="app.js"></script>
</head>

<body
    class="bg-background text-on-surface font-body-md selection:bg-secondary-container selection:text-on-secondary-container"
    data-page-ns="home">
    <div id="global-header"></div>
    <main class="pt-0">
        <!-- Hero Section -->
        <section class="relative min-h-[85vh] md:min-h-[80vh] flex items-center justify-center overflow-hidden pt-28 pb-14 md:pt-32 md:pb-20 hero-home-section">
            <!-- Contenedor del Slider Dinámico -->
            <div id="hero-slider-container" class="hero-slider-container"></div>

            <div
                class="relative z-10 w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop flex flex-col items-center text-center">
                <div class="text-on-primary space-y-4 sm:space-y-6 max-w-3xl flex flex-col items-center">
                    <div class="hero-logo-badge">
                        <img alt="Sueño Travel Logo"
                            width="75"
                            height="26"
                            class="h-[26px] w-auto max-w-[80px] object-contain"
                            src="Imagenes/logo_suenoTravel Chile.svg" />
                    </div>
                    <h1 class="font-display-lg text-3xl sm:text-4xl md:text-5xl lg:text-[56px] leading-tight md:leading-[64px] font-extrabold tracking-tight">
                        <span data-i18n="hero.line1" data-i18n-ns="home">Tu Próximo Destino</span> <br />
                        <span class="text-secondary-fixed" data-i18n="hero.line2" data-i18n-ns="home">Comienza
                            Aquí</span>
                    </h1>
                    <p class="font-body-lg text-sm sm:text-base md:text-body-lg max-w-2xl opacity-90 px-2 sm:px-0" data-i18n="hero.subtitle"
                        data-i18n-ns="home">
                        Diseñamos experiencias únicas y personalizadas para viajeros que buscan descubrir el mundo de una manera diferente. Desde los susurros del desierto en Jordania hasta los mármoles eternos de Grecia.
                    </p>
                    <div class="flex flex-wrap gap-4 pt-2 sm:pt-4 justify-center">
                        <a class="bg-secondary-container text-on-secondary-container px-6 sm:px-8 py-3.5 sm:py-4 rounded-lg font-bold text-base sm:text-lg hover:bg-secondary-fixed-dim transition-all shadow-lg flex items-center gap-2"
                            href="#destinos">
                            <span data-i18n="hero.cta" data-i18n-ns="home">Conoce nuestros próximos viajes</span>
                            <span class="material-symbols-outlined">explore</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <div id="section-modalidades"></div>
        <div id="section-destinations"></div>
        <div id="section-testimonials"></div>
        <div id="section-que-visitar"></div>
        <div id="section-about-us"></div>
        <div id="section-contact"></div>
    </main>
    <div id="section-footer"></div>
    <div id="contact-modal-container"></div>
    <div id="templates" style="display: none;"></div>
        <!-- trip-card-template was moved to components/trip-card-template.html -->

    <script type="module" src="src/js/home.js"></script>
    
    <script>
        // Module Loader: Inyecta los archivos HTML y luego avisa al sistema
        async function loadSection(id, url) {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(id).innerHTML = html;
                    return true;
                }
            } catch (error) {
                console.error('Error loading ' + url, error);
            }
            return false;
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Cargamos todas las secciones en paralelo
            await Promise.all([
                loadSection('section-modalidades', 'components/modalidades-viaje.html'),
                loadSection('section-destinations', 'components/destinations.html'),
                loadSection('section-testimonials', 'components/testimonials.html'),
                loadSection('section-que-visitar', 'components/que-visitar.html'),
                loadSection('section-about-us', 'components/about-us.html'),
                loadSection('section-contact', 'components/contact.html'),
                loadSection('section-footer', 'components/footer.html'),
                loadSection('contact-modal-container', 'components/contact-modal.html'),
                loadSection('templates', 'components/trip-card-template.html')
            ]);
            
            // Disparamos un evento para que i18n y home.js sepan que el DOM está completo
            if (window.i18n && typeof window.i18n.applyTranslations === 'function') {
                window.i18n.applyTranslations('home');
            }
            window.dispatchEvent(new Event('componentsLoaded'));
        });
    </script>
</body>

</html>
