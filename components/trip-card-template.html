<template id="trip-card-template">
        <div class="group trip-card-container">
            <div class="trip-card-bg absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-110"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-[#091524] via-[#091524]/40 to-transparent opacity-80 group-hover:opacity-90 transition-opacity"></div>
            <div class="trip-bottom-container">
                <div class="trip-text-container">
                    <span class="trip-chip-title bg-secondary text-on-primary px-3 py-1 rounded text-xs font-bold uppercase mb-2 inline-block"></span>
                    <h3 class="trip-flavor-title"></h3>
                    <div class="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-all duration-500 ease-in-out">
                        <div class="trip-hover-info max-w-md opacity-90 text-sm overflow-hidden flex flex-col gap-1 text-[#ffddb9]"></div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <a class="trip-link-btn">Ver Itinerario</a>
                </div>
            </div>
        </div>
    </template>
